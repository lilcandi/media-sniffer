    .sub { color: var(--text2); font-size: 12px; margin-bottom: 18px; }
    .card {

      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .card .title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .card .title .fn { flex: 1; font-size: 13px; }
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 10px;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .st-queued  { background: #64748b; }
    .st-working { background: var(--accent); }
    .st-done    { background: var(--ok); }
    .st-error   { background: var(--danger); }
    .bar { height: 8px; background: #e9edf2; border-radius: 5px; overflow: hidden; margin: 10px 0 6px; }
    .bar > i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 5px; transition: width .2s; }
    .meta { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
    .path {
      font-size: 12px;
      background: var(--accent-soft);
      color: #1d4ed8;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 8px;
      word-break: break-all;
    }
    .error {
      font-size: 12px;
      color: var(--danger);
      background: #fef2f2;
      border: 1px solid #f3c1c1;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 8px;
      word-break: break-all;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: #1d4ed8; color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.danger { color: var(--danger); border-color: #f3c1c1; }
    button.danger:hover { background: #fef2f2; color: var(--danger); }
    a.link { color: var(--accent); text-decoration: none; }
    a.link:hover { text-decoration: underline; }
    .muted { color: var(--text2); font-size: 12px; }
    .empty-tip { color: var(--text2); text-align: center; padding: 40px 0; }
    .queue-note { font-size: 12px; color: var(--warn); margin-top: 6px; }
